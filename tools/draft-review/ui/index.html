<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenWilds — draft review</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <h1 id="entry-name">…</h1>
    <span id="entry-path" class="muted"></span>
  </div>
  <div class="topbar-right">
    <span id="counts" class="counts" aria-live="polite"></span>
    <label class="toggle">
      <input type="checkbox" id="show-occurrences">
      Show GBIF observations
    </label>
    <span class="kbd-hint" title="Wheel: zoom · Drag: pan · 0: reset zoom · ⌘Z / ⌃Z: undo · ⇧⌘Z / ⌃Y: redo">?</span>
    <button type="button" id="finalize-button" class="finalize-button">Finalize</button>
  </div>
</header>

<main class="panes">
  <section class="pane pane-map" id="pane-map">
    <div class="map-shell" id="map-shell">
      <!-- na.svg gets inlined here by map.js -->
    </div>
    <aside class="bulk-actions" id="bulk-actions" hidden>
      <h2>Unconfirmed states / provinces</h2>
      <p class="hint">Bulk-set every county/division in a region. Individual counties can also be toggled by clicking them.</p>
      <ul id="bulk-list"></ul>
    </aside>
  </section>

  <div class="pane-divider" id="pane-divider" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize right pane"></div>

  <section class="pane pane-right" id="pane-right">
    <div class="tab-strip" role="tablist" aria-label="Review panel">
      <button class="tab" role="tab" id="tab-fields" data-tab="fields" aria-selected="true" aria-controls="panel-fields">Fields</button>
      <button class="tab" role="tab" id="tab-images" data-tab="images" aria-selected="false" aria-controls="panel-images" tabindex="-1">Images</button>
    </div>
    <div class="tab-panel" id="panel-fields" role="tabpanel" aria-labelledby="tab-fields">
      <div id="fields-list" class="fields-list"></div>
    </div>
    <div class="tab-panel" id="panel-images" role="tabpanel" aria-labelledby="tab-images" hidden>
      <p class="placeholder">Phase 7c will render image keep/exclude, alt-text editing, and drag-to-reorder here.</p>
      <ol class="image-list" id="image-list"></ol>
    </div>
  </section>
</main>

<div class="tooltip" id="tooltip" hidden></div>

<script type="module" src="/ui/tabs.js"></script>
<script type="module" src="/ui/map.js"></script>
<script type="module" src="/ui/occurrences.js"></script>
</body>
</html>
